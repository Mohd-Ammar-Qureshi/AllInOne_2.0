# Project-wide Gradle settings.

# JVM arguments for the Gradle daemon.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# org.gradle.parallel=true

# AndroidX
android.useAndroidX=true

# Architectures to build. Override from CLI with -PreactNativeArchitectures=arm64-v8a
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture (TurboModules / Fabric)
newArchEnabled=true

# Hermes JS engine (false = JSC)
hermesEnabled=true

# Edge-to-edge display
edgeToEdgeEnabled=false

# NOTE: Release signing secrets are NOT stored here.
# Put them in ~/.gradle/gradle.properties (see below) or pass them from CI.

MYAPP_UPLOAD_STORE_FILE=allinone-release.keystore
MYAPP_UPLOAD_KEY_ALIAS=allinone
MYAPP_UPLOAD_STORE_PASSWORD=H0027982
MYAPP_UPLOAD_KEY_PASSWORD=H0027982